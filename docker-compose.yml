name: deshal-erp-stack

services:
  deshal-erp:
    container_name: deshal-erp
    image: deshal-erp:${TAG:-2026.09.02}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://iewceykescyycodllftl.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlld2NleWtlc2N5eWNvZGxsZnRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDI5NzgsImV4cCI6MjEwMzkxODk3OH0.aeRmCHcTrslO9UCoYLljwLuAhrhX9gShNr4Lgw2x3Zc}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Loads local .env if present without breaking container if missing
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
