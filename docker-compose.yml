name: deshal-erp-stack

services:
  redis:
    container_name: deshal-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - deshal-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  deshal-erp:
    container_name: deshal-erp
    image: deshal-erp:${TAG:-2026.09.02}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://iewceykescyycodllftl.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlld2NleWtlc2N5eWNvZGxsZnRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDI5NzgsImV4cCI6MjEwMzkxODk3OH0.aeRmCHcTrslO9UCoYLljwLuAhrhX9gShNr4Lgw2x3Zc}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_ENABLED=${EMAIL_ENABLED}
    env_file:
      - path: .env
        required: false
    volumes:
      - whatsapp-sessions:/app/data/whatsapp-sessions
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.deshal-erp.rule=Host(`erp.deshalbm.com`)"
      - "traefik.http.routers.deshal-erp.entrypoints=websecure"
      - "traefik.http.routers.deshal-erp.tls=true"
      - "traefik.http.routers.deshal-erp.tls.certresolver=letsencrypt"
      - "traefik.http.services.deshal-erp.loadbalancer.server.port=3000"
      - "traefik.http.routers.deshal-web.rule=Host(`deshalbm.com`) || Host(`www.deshalbm.com`)"
      - "traefik.http.routers.deshal-web.entrypoints=websecure"
      - "traefik.http.routers.deshal-web.tls=true"
      - "traefik.http.routers.deshal-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.deshal-web.service=deshal-erp"
    networks:
      - proxy
      - deshal-internal
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  deshal-erp-worker:
    container_name: deshal-erp-worker
    image: deshal-erp:${TAG:-2026.09.02}
    restart: unless-stopped
    command: node dist/whatsappWorker.cjs
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    env_file:
      - path: .env
        required: false
    volumes:
      - whatsapp-sessions:/app/data/whatsapp-sessions
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - deshal-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
  deshal-internal:
    driver: bridge

volumes:
  redis-data:
  whatsapp-sessions:
