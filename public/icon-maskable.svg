    <circle cx="330" cy="355" r="24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3 3"/>
    <path d="M 322 355 L 327 360 L 339 349" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
