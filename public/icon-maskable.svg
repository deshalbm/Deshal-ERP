    <rect x="136" y="106" width="240" height="300" rx="18" fill="url(#cardGradMask)" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.3))"/>
    
    <!-- Receipt Header Strip -->
    <path d="M 136 124 C 136 114 144 106 154 106 L 358 106 C 368 106 376 114 376 124 L 376 152 L 136 152 Z" fill="#4f46e5"/>
    
    <circle cx="162" cy="129" r="5" fill="#fbbf24"/>
    <circle cx="178" cy="129" r="5" fill="#a5b4fc"/>

    <!-- Content Lines -->
    <rect x="160" y="180" width="110" height="12" rx="6" fill="#334155"/>
    <rect x="300" y="180" width="50" height="12" rx="6" fill="#4f46e5"/>
    
    <rect x="160" y="210" width="120" height="8" rx="4" fill="#64748b"/>
    <rect x="310" y="210" width="40" height="8" rx="4" fill="#059669"/>
    
    <rect x="160" y="234" width="95" height="8" rx="4" fill="#64748b"/>
