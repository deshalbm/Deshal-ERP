<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative inner glow circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3"/>

  <!-- Receipt Card Background -->
  <g filter="url(#dropShadow)">
    <rect x="116" y="86" width="280" height="340" rx="20" fill="url(#cardGrad)"/>
    
    <!-- Receipt Header Strip -->
    <path d="M 116 106 C 116 95 125 86 136 86 L 376 86 C 387 86 396 95 396 106 L 396 142 L 116 142 Z" fill="#4f46e5"/>
    
    <!-- Header Circles -->
    <circle cx="146" cy="114" r="6" fill="#fbbf24"/>
    <circle cx="166" cy="114" r="6" fill="#a5b4fc"/>
    <circle cx="186" cy="114" r="6" fill="#a5b4fc"/>

    <!-- Receipt Jagged Bottom Edge -->
    <path d="M 116 426 L 136 414 L 156 426 L 176 414 L 196 426 L 216 414 L 236 426 L 256 414 L 276 426 L 296 414 L 316 426 L 336 414 L 356 426 L 376 414 L 396 426 L 396 410 L 116 410 Z" fill="url(#cardGrad)"/>

    <!-- Receipt Content Lines -->
    <rect x="146" y="170" width="130" height="14" rx="7" fill="#334155"/>
    <rect x="310" y="170" width="56" height="14" rx="7" fill="#4f46e5"/>
    
    <!-- Divider -->
    <line x1="146" y1="202" x2="366" y2="202" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Item 1 -->
    <rect x="146" y="222" width="140" height="10" rx="5" fill="#64748b"/>
    <rect x="320" y="222" width="46" height="10" rx="5" fill="#059669"/>
    
    <!-- Item 2 -->
    <rect x="146" y="246" width="110" height="10" rx="5" fill="#64748b"/>
    <rect x="320" y="246" width="46" height="10" rx="5" fill="#059669"/>

    <!-- Item 3 -->
    <rect x="146" y="270" width="130" height="10" rx="5" fill="#64748b"/>
    <rect x="320" y="270" width="46" height="10" rx="5" fill="#059669"/>

    <!-- Divider 2 -->
    <line x1="146" y1="298" x2="366" y2="298" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Total Area -->
    <rect x="146" y="316" width="80" height="16" rx="8" fill="#1e293b"/>
    <rect x="270" y="312" width="96" height="24" rx="6" fill="#4f46e5"/>
    <rect x="282" y="320" width="72" height="8" rx="4" fill="#ffffff"/>

    <!-- Official Stamp Badge -->
    <circle cx="340" cy="370" r="32" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="3 3" opacity="0.85"/>
    <circle cx="340" cy="370" r="26" fill="#fef2f2" opacity="0.9"/>
    <path d="M 328 370 L 336 378 L 354 362" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Fingerprint / Smart Shield Icon Top Right Badge -->
  <g transform="translate(350, 40)">
    <circle cx="48" cy="48" r="44" fill="url(#goldGrad)" filter="url(#dropShadow)"/>
    <!-- Checkmark Shield -->
    <path d="M 48 24 L 66 32 C 66 50 56 64 48 70 C 40 64 30 50 30 32 Z" fill="#ffffff"/>
    <path d="M 41 46 L 46 51 L 56 40" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
